experiment_name: cdg_cysto_v3_exp1_three_class
run_type: formal
stage: v3_1_three_class
seed: 42

data:
  train_csv: outputs/v3/splits/cystods_train.csv
  val_csv: outputs/v3/splits/cystods_val.csv

task:
  name: three_class_cystods
  label_column: label_v3_three_class
  num_classes: 3
  classes:
    - malignant
    - benign_abnormal
    - normal

models:
  - swin_tiny
  - convnext_tiny

variants:
  - variant_id: ce_none
    loss:
      name: cross_entropy
    sampler:
      name: none
      enabled: false

  - variant_id: ce_class_balanced_sampler
    loss:
      name: cross_entropy
    sampler:
      name: class_balanced
      enabled: true
      mode: inverse_frequency
      beta: 0.999

  - variant_id: balanced_softmax_none
    loss:
      name: balanced_softmax
    sampler:
      name: none
      enabled: false

lesion:
  enabled: false
  strategy: classification_only
  attention_weight: 0.0

training:
  seeds: [42]
  epochs: 30
  patience: 8
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  cudnn_benchmark: true
  matmul_precision: high
  learning_rate: 0.0001
  weight_decay: 0.0001
  monitor: val_macro_f1
  prefer_cuda: true

outputs:
  root_dir: outputs/v3/runs
