experiment_name: cdg_cysto_v2_stage06_augmentation
run_type: formal
stage: stage06_augmentation
seed: 42
task:
  name: cancer_binary
  label_column: label_cancer_binary
  num_classes: 2
  classes:
  - non_cancer
  - cancer
dataset:
  train_split: outputs/v2/splits/cystods_train.csv
  val_split: outputs/v2/splits/cystods_val.csv
  calib_split: outputs/v2/splits/cystods_calib.csv
  test_internal_split: outputs/v2/splits/cystods_test_internal.csv
  external_split: outputs/v2/splits/ebtc_external_all.csv
training:
  epochs: 30
  early_stopping_patience: 8
  batch_size: 16
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  monitor: val_auprc
  seeds:
  - 42
  - 2025
  - 3407
  num_workers: 0
augmentation_grid:
- name: basic
  policy: basic
- name: modality_aware_v1
  policy: modality_aware_v1
evaluation:
  threshold: 0.5
  save_logits: true
  save_predictions: true
  compute_threshold_sweep: true
outputs:
  root_dir: outputs/v2/runs
candidate_variants:
- model: swin_tiny
  variant_id: ce_class_balanced_sampler
  loss:
    name: cross_entropy
  sampler:
    name: class_balanced
    enabled: true
    mode: inverse_frequency
- model: convnext_tiny
  variant_id: logit_adjustment_tau_0_5
  loss:
    name: logit_adjustment
    tau: 0.5
  sampler:
    name: none
    enabled: false
    mode: inverse_frequency
