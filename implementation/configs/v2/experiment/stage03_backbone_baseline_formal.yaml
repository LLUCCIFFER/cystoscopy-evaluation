experiment_name: cdg_cysto_v2_stage03_backbone_baseline
run_type: formal
stage: stage03_backbone_baseline
seed: 42
task:
  name: cancer_binary
  label_column: label_cancer_binary
  num_classes: 2
  classes: [non_cancer, cancer]
dataset:
  train_split: outputs/v2/splits/cystods_train.csv
  val_split: outputs/v2/splits/cystods_val.csv
  calib_split: outputs/v2/splits/cystods_calib.csv
  test_internal_split: outputs/v2/splits/cystods_test_internal.csv
  external_split: outputs/v2/splits/ebtc_external_all.csv
models:
  - efficientnet_b3
  - swin_tiny
  - convnext_tiny
training:
  epochs: 30
  early_stopping_patience: 8
  batch_size: 16
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  monitor: val_auroc
  seeds: [42]
  num_workers: 0
loss:
  name: cross_entropy
sampler:
  name: none
augmentation:
  name: basic
evaluation:
  threshold: 0.5
  save_logits: true
  save_predictions: true
  compute_threshold_sweep: true
outputs:
  root_dir: outputs/v2/runs
