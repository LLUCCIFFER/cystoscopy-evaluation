experiment_name: cdg_cysto_v2_stage04_imbalance
run_type: formal
stage: stage04_imbalance
seed: 42
task:
  name: cancer_binary
  label_column: label_cancer_binary
  num_classes: 2
  classes: [non_cancer, cancer]
dataset:
  train_split: outputs/v2/splits/cystods_train.csv
  val_split: outputs/v2/splits/cystods_val.csv
  calib_split: outputs/v2/splits/cystods_calib.csv
  test_internal_split: outputs/v2/splits/cystods_test_internal.csv
  external_split: outputs/v2/splits/ebtc_external_all.csv
models:
  - convnext_tiny
  - swin_tiny
  - efficientnet_b3
training:
  epochs: 30
  early_stopping_patience: 8
  batch_size: 16
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  monitor: val_auprc
  seeds: [42]
  num_workers: 0
augmentation:
  name: basic
evaluation:
  threshold: 0.5
  save_logits: true
  save_predictions: true
  compute_threshold_sweep: true
outputs:
  root_dir: outputs/v2/runs
imbalance_grid:
  - variant_id: ce_none
    loss:
      name: cross_entropy
    sampler:
      name: none
      enabled: false
  - variant_id: weighted_ce_none
    loss:
      name: weighted_cross_entropy
    sampler:
      name: none
      enabled: false
  - variant_id: ce_class_balanced_sampler
    loss:
      name: cross_entropy
    sampler:
      name: class_balanced
      enabled: true
      mode: inverse_frequency
  - variant_id: balanced_softmax_none
    loss:
      name: balanced_softmax
    sampler:
      name: none
      enabled: false
  - variant_id: logit_adjustment_tau_0_5
    loss:
      name: logit_adjustment
      tau: 0.5
    sampler:
      name: none
      enabled: false
  - variant_id: logit_adjustment_tau_1_0
    loss:
      name: logit_adjustment
      tau: 1.0
    sampler:
      name: none
      enabled: false
