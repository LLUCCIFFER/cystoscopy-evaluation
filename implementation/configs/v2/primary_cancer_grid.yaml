experiment_name: cdg_cysto_v2_primary_cancer
run_type: formal
stage: stage03_backbone_baseline
seed: 42
task:
  name: cystods_cancer_binary
  label_column: label_cancer_binary
  num_classes: 2
  classes: [non_cancer, cancer]
data:
  train_csv: outputs/v2/splits/cystods_train.csv
  val_csv: outputs/v2/splits/cystods_val.csv
  calib_csv: outputs/v2/splits/cystods_calib.csv
  test_internal_csv: outputs/v2/splits/cystods_test_internal.csv
  external_csv: outputs/v2/splits/ebtc_external_all.csv
training:
  epochs: 20
  patience: 5
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.05
  monitor: val_selection_score
  num_workers: 0
imbalance:
  sampler:
    enabled: true
    mode: effective_number
  loss:
    name: balanced_softmax
augmentation:
  policy: modality_aware_v1
calibration:
  method: temperature_scaling
thresholding:
  metrics: [default_0.5, youden, sensitivity_90, high_npv_95]
candidate_pool:
  - model_id: M1
    name: swin_tiny
    source: timm
    backbone: swin_tiny_patch4_window7_224
    pretrained: true
    input_size: 224
  - model_id: M2
    name: convnext_tiny
    source: timm
    backbone: convnext_tiny
    pretrained: true
    input_size: 224
  - model_id: M0
    name: efficientnet_b3
    source: timm
    backbone: efficientnet_b3
    pretrained: true
    input_size: 224
  - model_id: M3
    name: resnet50
    source: timm
    backbone: resnet50
    pretrained: true
    input_size: 224
  - model_id: M4
    name: dinov2_linear
    source: torch_hub
    backbone: dinov2_vits14
    pretrained: true
    input_size: 224
    feature_dim: 384
outputs:
  root_dir: outputs/v2/runs
