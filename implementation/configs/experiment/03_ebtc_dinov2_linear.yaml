experiment_name: 03_ebtc_dinov2_linear
seed: 42
dataset_config: configs/dataset/ebtc.yaml
model_config: configs/model/dinov2_linear.yaml
task:
  name: ebtc_four_class
  num_classes: 4
  classes: [HGC, LGC, NTL, NST]
data:
  train_split: train
  val_split: val
  test_split: test
training:
  epochs_stage1: 50
  epochs_stage2: 0
  batch_size: 16
  learning_rate_head: 0.0003
  learning_rate_backbone: 0.00001
metrics:
  primary: macro_f1
  secondary: [accuracy, balanced_accuracy, sensitivity, specificity, auroc, auprc, ece, brier, nll]
outputs:
  run_dir: outputs/runs/03_ebtc_dinov2_linear
